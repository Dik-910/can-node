name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: make test

      - name: Verify DBC is loadable
        run: |
          python3 -m pip install --quiet cantools
          python3 - <<'PY'
          import cantools
          db = cantools.database.load_file("docs/can_matrix.dbc")
          print(f"DBC ok: {len(db.messages)} messages")
          for m in db.messages:
              print(f"  0x{m.frame_id:03X} {m.name} dlc={m.length}")
          PY

      - name: Verify generated code is up to date
        run: |
          python3 -m pip install --quiet cantools
          # cantools 会在文件头写入生成时间戳，每次生成都不同。
          # 比较前先剔掉那一行，否则这条检查永远失败。
          strip_ts() { grep -v "generated by cantools version" "$1"; }
          strip_ts src/can/generated/can_matrix.c > /tmp/before.c
          strip_ts src/can/generated/can_matrix.h > /tmp/before.h
          make dbc
          strip_ts src/can/generated/can_matrix.c > /tmp/after.c
          strip_ts src/can/generated/can_matrix.h > /tmp/after.h
          diff -u /tmp/before.c /tmp/after.c
          diff -u /tmp/before.h /tmp/after.h
          echo "generated code matches the DBC"

      - name: Build Linux examples
        run: |
          make node
          make ecu-server
          make vcan-demo
          make bus-load

      # 固件传输服务：用 udsoncan 走完整刷写，再用 CRC32 验证写进去的字节
      - name: Flash interop over vcan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq can-utils
          python3 -m pip install --quiet python-can can-isotp udsoncan

          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

          make flash-interop | tee /tmp/flash.log

          # 必须真跑，而不是半路失败被吞掉
          grep -qE "Result: [0-9]+ passed, 0 failed" /tmp/flash.log
          # 核心断言：ECU 自己算的 CRC 与本地一致（走 0x31）
          grep -q "CRC32 computed by the ECU matches" /tmp/flash.log
          # 0x31 与 0x22 两条路径必须报告同一个值
          grep -q "0x31 and 0x22 report the same CRC" /tmp/flash.log
          # 块大小协商：服务端必须回报可用的块长度
          grep -q "server reported a block length" /tmp/flash.log
          echo "flash interop verified"

      # 故障码服务：让第三方栈触发真实的 ISO-TP 超时，再读码 / 读快照 / 清码
      - name: DTC interop over vcan
        run: |
          make dtc-interop | tee /tmp/dtc.log

          grep -qE "Result: [0-9]+ passed, 0 failed" /tmp/dtc.log
          # 故障必须是被协议栈自己检测出来的，不能是插桩造的
          grep -q "timeout produces a DTC" /tmp/dtc.log
          # 一次超时只能到 pending，不能直接 confirmed
          grep -q "a single timeout stays unconfirmed" /tmp/dtc.log
          # 快照要能被通用 tester 按 DID 解出来
          grep -q "one DID decoded from the snapshot record" /tmp/dtc.log
          # 清码必须有会话门槛
          grep -q "clear in default session -> NRC 0x22" /tmp/dtc.log
          echo "dtc interop verified"
