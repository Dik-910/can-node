name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: make test

      - name: Verify DBC is loadable
        run: |
          python3 -m pip install --quiet cantools
          python3 - <<'PY'
          import cantools
          db = cantools.database.load_file("docs/can_matrix.dbc")
          print(f"DBC ok: {len(db.messages)} messages")
          for m in db.messages:
              print(f"  0x{m.frame_id:03X} {m.name} dlc={m.length}")
          PY

      - name: Verify generated code is up to date
        run: |
          python3 -m pip install --quiet cantools
          # cantools 会在文件头写入生成时间戳，每次生成都不同。
          # 比较前先剔掉那一行，否则这条检查永远失败。
          strip_ts() { grep -v "generated by cantools version" "$1"; }
          strip_ts src/can/generated/can_matrix.c > /tmp/before.c
          strip_ts src/can/generated/can_matrix.h > /tmp/before.h
          make dbc
          strip_ts src/can/generated/can_matrix.c > /tmp/after.c
          strip_ts src/can/generated/can_matrix.h > /tmp/after.h
          diff -u /tmp/before.c /tmp/after.c
          diff -u /tmp/before.h /tmp/after.h
          echo "generated code matches the DBC"

      - name: Build Linux examples
        run: |
          make node
          make ecu-server
          make vcan-demo
          make bus-load
